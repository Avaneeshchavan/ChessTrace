services:
  - type: web
    name: chesstrace-api
    runtime: node
    plan: free
    rootDir: api-server
    healthCheckPath: /health
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: USE_COMPACT_STORAGE
        value: "true"
      - key: NODE_ENV
        value: production

  - type: web
    name: chesstrace-vision
    runtime: docker
    plan: free
    dockerfilePath: ./vision-engine/Dockerfile
    dockerContext: ./vision-engine
    buildFilter:
      paths:
        - vision-engine/**
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false

services:
  - type: web
    name: chesstrace-api
    env: node
    rootDir: api-server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: VISION_ENGINE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: chesstrace-vision
    env: python
    rootDir: vision-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
